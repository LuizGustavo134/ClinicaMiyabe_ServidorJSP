
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Quiz</title>

    <link rel="stylesheet" href="Style/index.css">
    
</head>

<body>

    <main class="main-container">

        <section class="quiz-card">

            <header class="card-header">
                <h1>O que você sabe de pokemon?</h1>
                <span class="question-number">01</span>
            </header>

            <div class="question-body">
                <h1>Qual é o Pokémon mais famoso da franquia?</h1>
            </div>

            <form action="#" method="post">
                <fieldset class="options-container">

                    <div class="option">
                        <input type="radio" id="a" name="resposta" value="A">
                        <label for="a">
                            <span class="label">A</span>
                            <span class="option-text">Charizard</span>
                        </label>
                    </div>

                    <div class="option">
                        <input type="radio" id="b" name="resposta" value="B">
                        <label for="b">
                            <span class="label">B</span>
                            <span class="option-text">Pikachu</span>
                        </label>
                    </div>

                    <div class="option">
                        <input type="radio" id="c" name="resposta" value="C">
                        <label for="c">
                            <span class="label">C</span>
                            <span class="option-text">Mewtwo</span>
                        </label>
                    </div>

                    <div class="option">
                        <input type="radio" id="d" name="resposta" value="D">
                        <label for="d">
                            <span class="label">D</span>
                            <span class="option-text">Bulbasaur</span>
                        </label>
                    </div>

                </fieldset>

                <footer class="card-footer">
                   <label>Seu nome:</label>
                   <input type="text" name="name">
                    <button type="submit">Responder</button>
                </footer>
            </form>

        </section>

    </main>

</body>
</html>
