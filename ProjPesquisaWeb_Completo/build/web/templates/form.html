<html>
    <head>
        <title>clinica Miyabe</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../Style/form.css">
    </head>
    <body>
        <div class="form-Main">
            <form>
                <div class="campos">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="ex: joão fernandes" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="ex: joaofe123@gmail.com" required>

                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="ex: (11) 91234-5678" required>

                    <div class="grupo-radio">
                        <span>Sexo:</span>
                        <input type="radio" id="masculino" name="sexo" value="masculino" required>
                        <label for="masculino">Masculino</label>
                        <input type="radio" id="feminino" name="sexo" value="feminino">
                        <label for="feminino">Feminino</label>
                    </div>

                    <select name="PCD" id="PCD" required>
                        <option value="">Possui alguma deficiência?</option>
                        <option value="nenhuma">Não</option>
                        <option value="fisica">Física</option>
                        <option value="visual">Visual</option>
                        <option value="auditiva">Auditiva</option>
                        <option value="intelectual">Intelectual</option>
                    </select>

                    <input type="text" id="responsavel" name="responsavel" placeholder="Responsável (se houver)">
                </div>
                <button type="submit">Enviar</button>
            </form>
        </div>
    </body>
</html>
